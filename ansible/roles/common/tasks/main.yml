---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600
  become: yes

- name: Install required packages
  apt:
    name:
      - curl
      - wget
      - unzip
      - python3
      - python3-pip
      - git
      - htop
    state: present
  become: yes

- name: Create app user
  user:
    name: appuser
    system: yes
    shell: /bin/false
    create_home: no
  become: yes
